site_name: Atom Loops
site_description: Atomic and reproducible operating-system deployment for embedded and desktop Linux.
site_url: https://atomloops.bromb.in
repo_url: https://github.com/mirkobrombin/AtomLoops
repo_name: mirkobrombin/AtomLoops
copyright: GPL-3.0

theme:
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Concepts:
      - The model: concepts/model.md
      - Deployment lifecycle: concepts/deployment.md
      - Boot lifecycle: concepts/boot.md
  - Architecture:
      - Components: architecture/components.md
      - The deployment WAL: architecture/wal.md
  - Security:
      - Trust model: security/trust-model.md
      - Anti-rollback: security/anti-rollback.md
  - Integrating Atom Loops: integration.md
  - Reference:
      - CLI and daemon: reference/cli.md
      - Release runbook: RELEASE-RUNBOOK.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mirkobrombin/AtomLoops
